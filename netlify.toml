# This repo holds both the server and the client: Netlify only builds Client/.
# (A netlify.toml at the repo root overrides the build settings in the Netlify UI.)
[build]
  base = "Client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# single-page app: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
